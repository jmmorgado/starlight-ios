name: Build unsigned IPA

# Builds an unsigned iOS .ipa for sideloading (Sideloadly / AltStore sign it at install time).
on:
  push:
    # Only starlight publishes releases. master mirrors upstream Moonlight and must not
    # publish a Starlight build. Other branches use build-test-ipa.yml (no release).
    branches:
      - starlight
    # The retag trigger file only runs the "Retag releases" workflow
    paths-ignore:
      - '.github/retag-trigger'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ipa:
    name: Build iOS IPA
    runs-on: macos-26-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (Release, iphoneos, unsigned)
        run: |
          xcodebuild -project Moonlight.xcodeproj \
            -scheme Moonlight \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="0.${{ github.run_number }}.0" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            clean build

      - name: Package IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app produced" >&2
            exit 1
          fi
          echo "Packaging $APP_PATH"
          mkdir -p dist/Payload
          cp -R "$APP_PATH" dist/Payload/
          cd dist
          zip -qry Starlight.ipa Payload
          ls -lh Starlight.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Starlight-ipa
          path: dist/Starlight.ipa
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N="${{ github.run_number }}"
          # Semantic-version tags so releases sort by number (v0.9.0 < v0.10.0)
          TAG="v0.$N.0"
          # Hand-written notes for this build win; otherwise use the commit message
          NOTES=".github/release-notes/build-$N.md"
          if [ ! -f "$NOTES" ]; then
            NOTES="release-notes.md"
            {
              echo "Starlight build $N (commit ${GITHUB_SHA::7})"
              echo
              echo "## Changes"
              git log -1 --pretty='%s%n%n%b' | grep -v -E '^(Co-Authored-By|Claude-Session):' || true
              echo
              echo "## Install"
              echo "Download \`Starlight.ipa\` below and install it with Sideloadly (see the README)."
            } > "$NOTES"
          fi
          gh release create "$TAG" dist/Starlight.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Starlight build $N" \
            --notes-file "$NOTES" \
            --latest
