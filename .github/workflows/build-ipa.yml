name: Build unsigned IPA

# Builds an unsigned iOS .ipa for sideloading (Sideloadly / AltStore sign it at install time).
on:
  push:
    branches:
      - master
      - main
      - deeplink-shortcuts
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ipa:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download iOS platform
        run: xcodebuild -downloadPlatform iOS

      - name: Build (Release, iphoneos, unsigned)
        run: |
          xcodebuild -project Moonlight.xcodeproj \
            -scheme Moonlight \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app produced" >&2
            exit 1
          fi
          echo "Packaging $APP_PATH"
          mkdir -p dist/Payload
          cp -R "$APP_PATH" dist/Payload/
          cd dist
          zip -qry Moonlight-Link.ipa Payload
          ls -lh Moonlight-Link.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-Link-ipa
          path: dist/Moonlight-Link.ipa
          retention-days: 30
