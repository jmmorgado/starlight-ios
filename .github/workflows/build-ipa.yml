name: Build unsigned IPA

# Builds an unsigned iOS .ipa for sideloading (Sideloadly / AltStore sign it at install time).
on:
  push:
    branches:
      - master
      - main
      - starlight
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ipa:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (Release, iphoneos, unsigned)
        run: |
          xcodebuild -project Moonlight.xcodeproj \
            -scheme Moonlight \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app produced" >&2
            exit 1
          fi
          echo "Packaging $APP_PATH"
          mkdir -p dist/Payload
          cp -R "$APP_PATH" dist/Payload/
          cd dist
          zip -qry Starlight.ipa Payload
          ls -lh Starlight.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Starlight-ipa
          path: dist/Starlight.ipa
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          {
            echo "Starlight build ${{ github.run_number }} (branch \`${GITHUB_REF_NAME}\`, commit ${SHORT_SHA})"
            echo
            echo "## Alterações"
            git log -1 --pretty=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' || true
            echo
            echo "## Instalar"
            echo "Descarrega \`Starlight.ipa\` abaixo e instala com o Sideloadly (ver SHORTCUTS.md)."
          } > release-notes.md
          gh release create "$TAG" dist/Starlight.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Starlight build ${{ github.run_number }}" \
            --notes-file release-notes.md \
            --latest
