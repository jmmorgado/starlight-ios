name: Build unsigned IPA

# Builds an unsigned iOS .ipa for sideloading (Sideloadly / AltStore sign it at install time).
on:
  push:
    branches:
      - master
      - main
      - starlight
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ipa:
    name: Build iOS IPA
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (Release, iphoneos, unsigned)
        run: |
          xcodebuild -project Moonlight.xcodeproj \
            -scheme Moonlight \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app produced" >&2
            exit 1
          fi
          echo "Packaging $APP_PATH"
          mkdir -p dist/Payload
          cp -R "$APP_PATH" dist/Payload/
          cd dist
          zip -qry Starlight.ipa Payload
          ls -lh Starlight.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Starlight-ipa
          path: dist/Starlight.ipa
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N="${{ github.run_number }}"
          TAG="build-$N"
          # Hand-written notes for this build win; otherwise use the commit message
          NOTES=".github/release-notes/build-$N.md"
          if [ ! -f "$NOTES" ]; then
            NOTES="release-notes.md"
            {
              echo "Starlight build $N (commit ${GITHUB_SHA::7})"
              echo
              echo "## Changes"
              git log -1 --pretty='%s%n%n%b' | grep -v -E '^(Co-Authored-By|Claude-Session):' || true
              echo
              echo "## Install"
              echo "Download \`Starlight.ipa\` below and install it with Sideloadly (see SHORTCUTS.md)."
            } > "$NOTES"
          fi
          gh release create "$TAG" dist/Starlight.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Starlight build $N" \
            --notes-file "$NOTES" \
            --latest

      - name: Sync notes of earlier releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in .github/release-notes/build-*.md; do
            [ -f "$f" ] || continue
            TAG=$(basename "$f" .md)
            [ "$TAG" = "build-${{ github.run_number }}" ] && continue
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$f"
              echo "Updated notes for $TAG"
            fi
          done
